        if(m.length) mudancas = `<div class="mudou">${m.slice(0,6).map(escapar).join(" ")}</div>`;
      }
      return `<div class="mov">
        ${miniatura(c.snap, s.figuras, false)}
        <div>
          <div class="n">MOVIMENTO ${String(i+1).padStart(2,"0")}${c.min ? " — aos " + c.min + " min" : ""}</div>
          <p>${escapar(c.titulo)}</p>
          ${mudancas}
        </div>
      </div>`;
    }).join("") : ""}

    ${(dados.opcoes.leituraLaudo && s.figuras.length > 1) ? (() => {
      const fr = frasesDaLeitura(lerCampo(posicoesDe(s.figuras)));
      if(!fr.length) return "";
      return `<h2>Leitura do campo ao encerramento</h2>
        <ul class="leitura-laudo">${fr.map(x => `<li>${escapar(x.t)}</li>`).join("")}</ul>
        <p class="ressalva">Descrição geométrica das posições e direções registradas ao término do atendimento,
        gerada automaticamente. Não constitui interpretação; a leitura clínica é de responsabilidade da terapeuta.</p>`;
    })() : ""}

    ${s.frase ? `<h2>Frases de força trabalhadas</h2><p class="frase-forca">${escapar(s.frase)}</p>` : ""}
    ${bloco("Movimento final", s.final)}
    ${bloco("Observações da terapeuta", s.obs)}
    ${bloco("Encaminhamento e tarefa", s.tarefa)}
    ${s.retorno ? `<h2>Retorno sugerido</h2><p class="txt">${dataBR(s.retorno)}</p>` : ""}

    ${(() => {
      const lista = sessoesDe(s.cliente);
      if(lista.length < 2) return "";
      const i = lista.findIndex(x => x.id === s.id);
      const dbr = d => d ? d.split("-").reverse().join("/") : "—";
      const rec = recorrencias(lista);
      return `<h2>Histórico do constelado</h2>
        <p class="txt">Este é o ${i+1}º atendimento registrado de ${escapar(s.cliente)}, de um total de ${lista.length}.</p>
        <table class="reps">
          <tr><th style="width:8%">Nº</th><th style="width:16%">Data</th><th>Tema trazido</th><th style="width:22%">Registro</th></tr>
          ${lista.map((x,k) => `<tr${x.id === s.id ? ' style="font-weight:600"' : ""}>
            <td>${String(k+1).padStart(2,"0")}</td><td>${dbr(x.data)}</td>
            <td>${escapar(x.tema || "—")}</td>
            <td>${(x.figuras||[]).length} repr. · ${(x.cenas||[]).length} mov.</td>
          </tr>`).join("")}
        </table>
        ${rec.length ? `<p class="txt" style="margin-top:8px"><b>Presenças recorrentes no campo:</b> ${
          rec.map(([n,q]) => `${escapar(n)} (${q}×)`).join("; ")}.</p>` : ""}`;
    })()}

    <div class="fecho">${escapar(l.local || "")}${l.local ? ", " : ""}${dataBR(s.data)}.</div>
    <div class="assinaturas">
      <div class="assina">
        <b>${escapar(l.terapeuta || "")}</b>
        ${escapar(l.credencial || "Terapeuta em Constelação Familiar")}
      </div>
    </div>

    <div class="rodape">
      Este documento registra o atendimento em Constelação Familiar realizado na data indicada, para fins de
      acompanhamento terapêutico do próprio constelado. A Constelação Familiar é uma prática de abordagem
      sistêmica e não constitui diagnóstico, prognóstico ou tratamento médico ou psicológico, não substituindo
      acompanhamento profissional nessas áreas. Contém informações sensíveis de caráter pessoal e familiar,
      de acesso restrito ao constelado e à terapeuta responsável, nos termos da Lei nº 13.709/2018.
    </div>`;
  setTimeout(() => window.print(), 60);
}

$("#arquivo").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const leitor = new FileReader();
  leitor.onload = () => {
    try{
      const novo = JSON.parse(leitor.result);
      if(!novo.sessoes) throw new Error("formato");
      if(!confirm("Substituir todas as sessões atuais pelo conteúdo do arquivo?")) return;
      dados = novo;
      normalizar();
      salvar(); aplicarOpcoes(); refazerFundo(); carregarSessao();
      toast("Backup restaurado");
    }catch(err){
      aviso("Arquivo não reconhecido. Escolha um backup gerado por este aplicativo.");
    }
  };
  leitor.readAsText(f);
  e.target.value = "";
};

function normalizar(){
  dados.opcoes = Object.assign({}, OPCOES_PADRAO, dados.opcoes || {});
  if(dados.opcoes.emojiNovo === true) dados.opcoes.figuraPadrao = "emoji";   // nome antigo
  delete dados.opcoes.emojiNovo;
  if(!["claro","neutro","violeta"].includes(dados.opcoes.tema)) dados.opcoes.tema = "claro";
  if(!["icone","emoji","geometria"].includes(dados.opcoes.figuraPadrao)) dados.opcoes.figuraPadrao = "icone";
  const tm = +dados.opcoes.tamanho;
  dados.opcoes.tamanho = (tm >= 80 && tm <= 220) ? tm : 145;
  if(!FUNDOS[dados.opcoes.fundo]) dados.opcoes.fundo = "nevoa";
  if(dados.opcoes.agua === false) dados.opcoes.animar = false;   // nome antigo
  dados.laudo = dados.laudo || {};
  const antigas = { origem:"paterna", conjuge:"conjugal", abstrato:"sintoma", solucao:"luz", neutro:"filhos" };
  (dados.sessoes || []).forEach(s => {
    s.modalidade = s.modalidade || "Individual presencial";
    s.anamnese = s.anamnese || {};
    s.proxOrdem = s.proxOrdem || 0;
    (s.figuras || []).forEach((f, i) => {
      if(f.ger === undefined) f.ger = null;
      if(f.relato === undefined) f.relato = "";
      if(!f.ordem){ f.ordem = i + 1; }
      if(f.ordem > s.proxOrdem) s.proxOrdem = f.ordem;
    });
    s.obs = s.obs ?? "";
    s.segundos = s.segundos || 0;
    s.correndo = !!s.correndo;
    s.desde = s.desde || null;
    (s.figuras || []).forEach(f => {
      if(antigas[f.cor]) f.cor = antigas[f.cor];
      if(!CORES[f.cor]) f.cor = "materna";
      if(f.corLivre === undefined) f.corLivre = null;
      if(f.emoji === undefined) f.emoji = null;
      if(!MAPA_ICONES[f.icone]) f.icone = "pessoa";
      if(f.forma === "e" && !f.emoji) f.forma = "n";
    });
  });
  if(!sessao()) dados.atual = dados.sessoes[0]?.id;
}

function abrirFormulario({ titulo, texto, campos, ok, aoConfirmar }){
  const veu = document.createElement("div");
  veu.className = "veu";
  veu.innerHTML = `
    <div class="caixa">
      <h2>${escapar(titulo)}</h2>
      ${texto ? `<p>${escapar(texto)}</p>` : ""}
      ${campos.map((c,i) => `
        <div class="grupo">
          ${c.semRotulo ? "" : `<label class="mini">${escapar(c.rotulo)}</label>`}
          <input class="ipt" ${i===0?'id="cx-in"':""} data-i="${i}" placeholder="${escapar(c.rotulo)}" value="${escapar(c.valor)}">
        </div>`).join("")}
      <div class="fim">
        <button class="btn" id="cx-nao">Cancelar</button>
        <button class="btn principal" id="cx-sim">${escapar(ok)}</button>
      </div>
    </div>`;
  document.body.appendChild(veu);
  const entradas = Array.from(veu.querySelectorAll("input[data-i]"));
  entradas[0].focus(); entradas[0].select();
  const fechar = () => veu.remove();
  const confirmar = () => {
    const r = {};
    campos.forEach((c,i) => { r[c.chave] = entradas[i].value; });
    aoConfirmar(r); fechar();
  };
  veu.querySelector("#cx-nao").onclick = fechar;
  veu.querySelector("#cx-sim").onclick = confirmar;
  entradas.forEach(i => {
    i.onkeydown = e => {
      if(e.key === "Enter") confirmar();
      if(e.key === "Escape") fechar();
    };
  });
  veu.onclick = e => { if(e.target === veu) fechar(); };
}

document.addEventListener("keydown", e => {
  const editando = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key === "Escape"){
    const carta = $("#veu-carta"); if(carta) return carta.remove();
    const an = $("#veu-anamnese"); if(an){ an.remove(); return pintarAnamnese(); }
    const fi = $("#veu-ficha"); if(fi) return fi.remove();
    if(document.body.classList.contains("apresentando")) return apresentar(false);
    if(document.body.className.includes("gaveta-")) return fecharGavetas();
    if(!editando) selecionar(null);
    return;
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); return salvarCena(); }
  if(editando) return;

  const f = figSel(); if(!f) return;
  const s = sessao();

  if(e.key === "Delete" || e.key === "Backspace"){
    e.preventDefault();
    s.figuras = s.figuras.filter(x => x.id !== f.id);
    selecionar(null); cenaAtiva = null; salvar(); desenharTrilho(); return;
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "d"){
    e.preventDefault();
    const copia = { ...f, id:id(), x:f.x+70, y:f.y+44 };
    s.figuras.push(copia); selecionar(copia.id); salvar(); return;
  }
  const setas = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
  if(setas[e.key]){
    e.preventDefault();
    if(e.shiftKey){
      f.ang = (f.ang + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 5 : -5) + 360) % 360;
    } else {
      f.x += setas[e.key][0] * 12;
      f.y += setas[e.key][1] * 12;
    }
    cenaAtiva = null; render(); painelProps(); salvar();
  }
});

let tempoSalvar;
function salvar(){
  clearTimeout(tempoSalvar);
  tempoSalvar = setTimeout(() => Banco.gravar("dados", dados), 260);
}

(async function iniciar(){
  const ok = await Banco.abrir();
  const guardado = await Banco.ler("dados");

  if(guardado && guardado.sessoes && guardado.sessoes.length){
    dados = guardado;
  } else {
    const s = sessaoNova("Sessão 1");
    dados.sessoes = [s];
    dados.atual = s.id;
  }
  normalizar();

  if(!ok){
    aviso("Este ambiente não permite armazenamento local — o trabalho desta sessão não será salvo ao fechar a aba. Publique o arquivo para gravar, e use ⋯ ▸ Backup enquanto isso.");
  }

  montarPaleta();
  montarFundos();
  aplicarOpcoes();
  montarPalco();
  carregarSessao();
})();
